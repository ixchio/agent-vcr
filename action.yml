# Agent VCR — Agent CI GitHub Action
#
# Runs replay regression (`vcr ci`) on every PR: compares candidate agent
# recordings against golden baselines with zero LLM cost.
#
# Usage in your agent repo:
#
#   - uses: ixchio/agent-vcr@v1
#     with:
#       dataset: refunds
#       candidates-dir: .vcr/candidates
name: "Agent VCR CI"
description: "Replay agent recordings against golden baselines — pass/degraded/fail + risk report"
author: "ixchio"

inputs:
  dataset:
    description: "Replay dataset name (created with `vcr dataset create/add`)"
    required: true
  candidates-dir:
    description: "Directory of <case-name>.vcr candidate recordings"
    required: false
    default: ".vcr/candidates"
  datasets-dir:
    description: "Directory holding dataset JSON files"
    required: false
    default: ".vcr/datasets"
  golden-dir:
    description: "Golden-run cache directory"
    required: false
    default: ".vcr/golden"
  fail-on:
    description: "Gate threshold: degraded | failed | never"
    required: false
    default: "failed"
  package:
    description: "Pip spec to install (default: latest release)"
    required: false
    default: "ai-agent-vcr"
  python-version:
    description: "Python version for the check"
    required: false
    default: "3.12"

outputs:
  report:
    description: "Path to the JSON regression report"
    value: ${{ steps.ci.outputs.report }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Agent VCR
      shell: bash
      env:
        VCR_PACKAGE: ${{ inputs.package }}
      run: pip install "$VCR_PACKAGE"

    - name: Run replay regression
      id: ci
      shell: bash
      # Inputs go through env vars, never ${{ }} inside the script, so values
      # derived from PR data (branch names, titles) cannot inject shell code.
      env:
        VCR_DATASET: ${{ inputs.dataset }}
        VCR_CANDIDATES: ${{ inputs.candidates-dir }}
        VCR_DATASETS_DIR: ${{ inputs.datasets-dir }}
        VCR_GOLDEN_DIR: ${{ inputs.golden-dir }}
        VCR_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        # Set the output first so it is available even when the gate fails.
        echo "report=agent-ci-report.json" >> "$GITHUB_OUTPUT"
        vcr ci run \
          --dataset "$VCR_DATASET" \
          --candidates "$VCR_CANDIDATES" \
          --datasets-dir "$VCR_DATASETS_DIR" \
          --golden-dir "$VCR_GOLDEN_DIR" \
          --fail-on "$VCR_FAIL_ON" \
          --report agent-ci-report.json \
          --markdown agent-ci-report.md

    - name: Upload regression report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: agent-ci-report
        path: |
          agent-ci-report.json
          agent-ci-report.md
